async function connectOwner(){

 try{
  provider=new ethers.providers.Web3Provider(window.ethereum);

 }catch(e){log('连接失败:'+(e.reason||e.message),'err')}
}
async function refreshImpl(){try{const pc=new ethers.Contract(PROXY,['function implementation() view returns(address)'],provider||new ethers.providers.JsonRpcProvider('https://bsc-dataseed1.binance.org:443'));$('curImpl').textContent=await pc.implementation();}catch(e){$('curImpl').textContent='读取失败'}}
async function deployNewImpl(){
 if(!signer){log('请先连接Owner钱包','err');return}
 $('deployBtn').disabled=true;$('deployBtn').textContent='部署中...';
 try{
  log('使用 V20 bytecode('+V20_BC.length+' hex)','info');
  const f=new ethers.ContractFactory(V20_ABI,V20_BC,signer);
  log('部署新实现中...(请钱包确认)','info');
  const c=await f.deploy({gasLimit:7000000});
  log('已广播:'+c.deployTransaction.hash,'info');
  await c.deployed();
  newImpl=c.address;
  $('newImpl').textContent=newImpl;
  $('upgTarget').textContent=newImpl;
  log('新实现(V20)部署成功:'+newImpl,'ok');
  $('upgBtn').disabled=false;
 }catch(e){log('部署失败:'+(e.reason||e.message),'err')}
 $('deployBtn').textContent='① 部署新实现（V20）';$('deployBtn').disabled=false;
}
async function upgradeProxy(){
 if(!signer||!newImpl){log('请先完成①部署','err');return}
 $('upgBtn').disabled=true;$('upgBtn').textContent='升级中...';
 try{
  const pc=new ethers.Contract(PROXY,['function upgradeTo(address)'],signer);
  log('upgradeTo('+newImpl+')...(请钱包确认)','info');
  const tx=await pc.upgradeTo(newImpl,{gasLimit:400000});
  await tx.wait();
  log('升级成功!','ok');
  await refreshImpl();
 }catch(e){log('升级失败:'+(e.reason||e.message),'err')}
 $('upgBtn').textContent='② 升级 Proxy';$('upgBtn').disabled=false;
}
