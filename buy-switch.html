<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NNB 买入开关工具</title>
<style>
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#0b0e1a;color:#e8ecf5;max-width:520px;margin:0 auto;padding:20px}
h1{color:var(--gold,#e8c441);font-size:20px;text-align:center;margin-bottom:6px}
.sub{color:#8b93a8;font-size:12px;text-align:center;margin-bottom:20px}
.card{background:#11152a;border:1px solid #2a3560;border-radius:14px;padding:16px;margin-bottom:14px}
h2{color:#00c896;font-size:15px;margin:0 0 12px}
.btn-connect{background:linear-gradient(135deg,#e8c441,#ff8a3d);color:#1a0828;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer}
.btn-on,.btn-off{width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px}
.btn-on{background:linear-gradient(135deg,#00c896,#00e68a);color:#0a0e1a}
.btn-off{background:linear-gradient(135deg,#e83a4d,#ff6b6b);color:#fff}
.btn:disabled{opacity:0.5}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3560;font-size:13px}
.row:last-child{border-bottom:none}
.l{color:#8b93a8}.v{color:#e8c441;font-weight:600}
.res{background:#0d1524;border-radius:10px;padding:12px;margin-top:12px;font-size:12px;white-space:pre-wrap;max-height:180px;overflow-y:auto}
#status{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.95);color:#0a0e1a;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;z-index:9999;transition:opacity .3s}
#status.show{opacity:1}#status.ok{background:#00c896;color:#fff}#status.err{background:#e83a4d;color:#fff}
</style>
</head>
<body>
<h1>🔧 NNB 买入开关</h1>
<div class="sub">连接 owner 钱包，控制用户能否用 U 买入 NNB</div>

<div class="card">
  <h2>1. 连接 owner</h2>
  <button class="btn-connect" onclick="connect()">连接 Owner 钱包</button>
  <div id="acct" style="margin-top:8px;font-size:12px;color:#8b93a8">未连接</div>
</div>

<div class="card">
  <h2>2. 当前买入状态</h2>
  <div class="row"><span class="l">buyEnabled</span><span class="v" id="cur">查询中...</span></div>
  <button class="btn-on" id="onBtn" onclick="doBuy(true)" disabled>🟢 开启买入</button>
  <button class="btn-off" id="offBtn" onclick="doBuy(false)" disabled>🔴 禁止买入</button>
  <div style="margin-top:10px;font-size:11px;color:#8b93a8">开启=用户可用U买入NNB; 禁止=买不了(卖出不受影响)</div>
</div>

<div class="card"><h2>执行日志</h2><div class="res" id="res">等待操作...</div></div>
<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
const PROXY='0xB94cD1E6f6D73022FFb8C813864411405d706125';
const OWNER='0xc9521A8dd88535cb4606aeE005D50f5b9ccA5C09';
const ABI=['function buyEnabled() view returns(bool)','function setBuyEnabled(bool)'];
let provider,signer,addr=null;
const $=id=>document.getElementById(id);
function toast(m,t){const s=$('status');s.textContent=m;s.className='show '+(t||'');setTimeout(()=>s.className='',3000)}
function log(m){const r=$('res');r.textContent=new Date().toLocaleTimeString()+'  '+m+'\n'+r.textContent}

async function connect(){
  if(!window.ethereum){toast('请在钱包浏览器打开','err');return}
  try{
    provider=new ethers.providers.Web3Provider(window.ethereum);
    await provider.send('eth_requestAccounts',[]);
    signer=provider.getSigner();addr=await signer.getAddress();
    $('acct').textContent='已连接: '+addr;
    if(addr.toLowerCase()===OWNER.toLowerCase()){toast('✅ owner已连接','ok');log('✅ owner已连接');$('onBtn').disabled=false;$('offBtn').disabled=false;}
    else{toast('⚠️ 需用owner(0xc952...C09)连接','err');log('非owner: '+addr);}
    loadBuy();
  }catch(e){toast('连接失败','err');log(e.message)}
}
async function loadBuy(){
  try{
    if(!provider)provider=new ethers.providers.JsonRpcProvider('https://bsc-dataseed1.binance.org:443');
    const c=new ethers.Contract(PROXY,ABI,provider);
    const v=await c.buyEnabled();
    $('cur').textContent=v?'🟢 开启(可买)':'🔴 禁止(不可买)';
    log('当前买入：'+(v?'开启':'禁止'));
  }catch(e){$('cur').textContent='—';log('查询失败:'+e.message)}
}
async function doBuy(v){
  if(!signer){toast('请先连接owner','err');return}
  if(addr.toLowerCase()!==OWNER.toLowerCase()){toast('非owner','err');return}
  const btn=v?$('onBtn'):$('offBtn');btn.disabled=true;
  try{
    log('执行 setBuyEnabled('+v+')...');
    const c=new ethers.Contract(PROXY,ABI,signer);
    const tx=await c.setBuyEnabled(v);
    log('交易提交: '+tx.hash.slice(0,16)+'...');toast('请在钱包确认','');
    const r=await tx.wait();
    if(r.status===1){
      toast('✅ 买入已'+(v?'开启':'禁止'),'ok');
      log('✅ setBuyEnabled 成功, 买入已'+(v?'开启':'禁止'));
      loadBuy();
    }else{toast('❌ 失败','err');log('交易失败');}
  }catch(e){log('失败:'+(e.reason||e.message));toast('失败:'+(e.reason||e.message).slice(0,50),'err');}
  finally{btn.disabled=false;}
}
if(document.readyState==='complete')setTimeout(loadBuy,300);
</script>
</body>
</html>
