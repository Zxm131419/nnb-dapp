name: NNB 用户数据库自动同步

on:
  schedule:
    # 每天 UTC 0:00 (北京时间 8:00) 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pycryptodome requests

      - name: 运行同步脚本
        run: python3 scripts/sync_chain.py

      - name: 提交更新
        run: |
          git config user.name "nnb-bot"
          git config user.email "nnb-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "自动同步用户数据库 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
