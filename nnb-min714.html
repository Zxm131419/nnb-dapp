<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NNB 買礦機最低門檻設定</title>
<script src="ethers.min.js"></script>
<script src="nnb-min714-data.js"></script>
<style>
:root{--gold:#c9a227;--bg:#0f1220;--card:#171b2e;--line:#2a3050;--txt:#e6e9f5;--dim:#8b93b3;--ok:#37d67a;--bad:#ff5c5c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);padding:14px;font-size:14px}
h1{color:var(--gold);font-size:19px;margin:6px 0 10px}
h3{font-size:15px;margin:12px 0 6px;color:#dfe4f7}
.sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.banner{background:#1b2a05;border:1px solid #4b6b12;color:#b6ff48;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.7;margin:10px 0}
.warn{background:#2a1a05;border:1px solid #6b4b12;color:#ffd48a;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.8;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
button{background:var(--gold);color:#171204;border:none;padding:14px 18px;border-radius:9px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;font-size:14px;width:100%}
button.g{background:linear-gradient(135deg,#37d67a,#1f8f5a);color:#fff}
button.b{background:#2a3156;color:#cdd5f0}
button:disabled{opacity:.45;cursor:not-allowed}
.out{background:#0a0d18;border:1px dashed var(--line);border-radius:10px;padding:10px;font-family:monospace;font-size:12px;white-space:pre-wrap;margin:8px 0;color:#b7c6ff;max-height:360px;overflow:auto;line-height:1.7}
input{width:100%;background:#0d1020;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px;font-family:monospace;font-size:13px;margin:6px 0}
</style>
</head>
<body>
<h1>NNB 買礦機最低門檻（owner）</h1>
<div class="sub">設定 minBuyMining · 只改一個參數 · 不影響全局</div>

<div class="banner">
✅ <b>做什麼</b><br>
呼叫 <code>setMinBuyMining(714e18)</code><br>
・買礦機最低 = <b>714 NNB</b>（約 10U）<br>
・只改一個參數，不動其他邏輯
</div>

<div class="card">
<h3>① 連接錢包（owner）</h3>
<button onclick="connect()">連接錢包</button>
<div class="out" id="conn">未連線</div>
</div>

<div class="card">
<h3>② 目前值 & 設定</h3>
<label style="font-size:12px;color:var(--dim)">最低 NNB 數量</label>
<input id="amtVal" value="714">
<button class="b" onclick="check()">查詢目前值</button>
<button class="g" id="btnSet" onclick="doSet()" disabled>設定最低 714 NNB</button>
<div class="out" id="out">—</div>
</div>

<script>
var provider, signer, acct=null;
const OWNER=MIN714.owner.toLowerCase();
const MINING=MIN714.Mining.address;
const ABI=MIN714.Mining.abi;
function $(i){return document.getElementById(i);}
function L(id,t){var e=$(id);e.textContent+='\n'+t;e.scrollTop=e.scrollHeight;}
function clr(id){$(id).textContent='';}

async function connect(){
  if(!window.ethereum){L('conn','❌ 未偵測到錢包');return;}
  try{
    provider=new ethers.providers.Web3Provider(window.ethereum);
    const net=await provider.getNetwork();
    if(net.chainId!==56){L('conn','❌ 非 BSC 主網');return;}
    await window.ethereum.request({method:'eth_requestAccounts'});
    signer=provider.getSigner();
    acct=await signer.getAddress();
    L('conn','✅ 已連線: '+acct);
    if(acct.toLowerCase()===OWNER){ L('conn','✅ owner 確認'); $('btnSet').disabled=false; }
    else { L('conn','❌ 不是 owner 錢包（'+MIN714.owner+'）'); }
    await check();
  }catch(e){ L('conn','❌ '+String(e.message||e).slice(0,150)); }
}

async function check(){
  clr('out');
  try{
    const rp=provider||new ethers.providers.JsonRpcProvider('https://bsc-dataseed.binance.org');
    const c=new ethers.Contract(MINING,ABI,rp);
    const cur=await c.minBuyMining();
    L('out','=== 目前值 ===');
    L('out','  minBuyMining = '+ethers.utils.formatUnits(cur,18)+' NNB');
    L('out','');
    L('out','=== 目標 ===');
    L('out','  714 NNB（約 10U）');
  }catch(e){ L('out','❌ '+String(e.message||e).slice(0,150)); }
}

async function doSet(){
  clr('out');
  const amt=parseFloat($('amtVal').value);
  if(!(amt>0)){ L('out','❌ 數值無效'); return; }
  if(!acct){ L('out','❌ 請先連接錢包'); return; }
  if(acct.toLowerCase()!==OWNER){ L('out','❌ 需用 owner 錢包'); return; }
  try{
    $('btnSet').disabled=true;
    const c=new ethers.Contract(MINING,ABI,signer);
    L('out','=== 設定 minBuyMining = '+amt+' NNB ===');
    L('out','請在錢包確認...');
    const tx=await c.setMinBuyMining(ethers.utils.parseUnits(amt.toString(),18),{gasLimit:200000});
    L('out','tx: '+tx.hash);
    L('out','等待確認...');
    await tx.wait();
    L('out','✅ 交易成功');
    await new Promise(r=>setTimeout(r,3000));
    const cur=await c.minBuyMining();
    const ok = Number(ethers.utils.formatUnits(cur,18))===amt;
    L('out','');
    L('out','=== 驗證 ===');
    L('out','  minBuyMining = '+ethers.utils.formatUnits(cur,18)+' NNB '+(ok?'✅':'❌'));
    L('out','');
    L('out', ok ? '🎉 設定成功！' : '⚠️ 未生效，請重試');
  }catch(e){ L('out','❌ '+String(e.reason||e.message||e).slice(0,200)); }
  $('btnSet').disabled=false;
}
</script>
</body>
</html>
